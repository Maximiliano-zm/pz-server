services:
  pz-server:
    image: indifferentbroccoli/projectzomboid-server-docker:latest
    container_name: pz-b42-server
    restart: unless-stopped
    stop_grace_period: 60s

    environment:
      SERVER_BRANCH: unstable
      MEMORY_XMS_GB: "${MEMORY_XMS_GB:-15}"
      MEMORY_XMX_GB: "${MEMORY_XMX_GB:-30}"

      SERVER_NAME: servertest
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SERVER_PASSWORD: ${SERVER_PASSWORD}
      RCON_PASSWORD: ${RCON_PASSWORD}

      SERVER_PORT: "16261"
      SERVER_PUBLIC: "false"
      MAX_PLAYERS: "20"

      EXTRA_JVM_ARGS: "-XX:+UseZGC -XX:+UseStringDeduplication -XX:MaxGCPauseMillis=50"

    ports:
      - "16261:16261/udp"
      - "16262:16262/udp"
      - "27015:27015/tcp"

    volumes:
      - pz-server-data:/project-zomboid
      - pz-server-config:/project-zomboid-config

    mem_limit: 32g
    mem_reservation: 15g

volumes:
  pz-server-data:
  pz-server-config:
